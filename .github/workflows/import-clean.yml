name: Import StoryFlow project files

on:
  push:
    branches: [main]
    paths:
      - "import_clean/**"
      - ".github/workflows/import-clean.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project archive
        run: |
          cat import_clean/chunk_*.txt | tr -d '\n\r' | base64 --decode > storyflow_clean.tar.gz
          echo "b065440e7e6bab610ee3da9ddf911f4373120f65c4183f2866d90efee1f4510c  storyflow_clean.tar.gz" | sha256sum --check

      - name: Extract project into repository root
        run: |
          tar -xzf storyflow_clean.tar.gz -C .
          rm -rf import_clean chunks
          rm -f site.zip storyflow_clean.tar.gz

      - name: Commit clean project structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import StoryFlow project files directly"
          git push
